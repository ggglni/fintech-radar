<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fintech Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1a18;
    --ink2: #6b6b66;
    --ink3: #a8a8a2;
    --bg: #ffffff;
    --bg2: #f5f4f0;
    --bg3: #eceae4;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.15);
    --green: #1D9E75;
    --green-bg: #E1F5EE;
    --green-text: #085041;
    --amber: #BA7517;
    --amber-bg: #FAEEDA;
    --amber-text: #633806;
    --purple-bg: #EEEDFE;
    --purple-text: #3C3489;
    --blue-bg: #E6F1FB;
    --blue-text: #042C53;
    --coral: #D85A30;
    --coral-bg: #FAECE7;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f0ede6;
      --ink2: #9e9b94;
      --ink3: #5a5954;
      --bg: #1a1916;
      --bg2: #222220;
      --bg3: #2c2b28;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
    }
  }

  body {
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    background: var(--bg3);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  /* TOP NAV */
  .topnav {
    background: var(--bg);
    border-bottom: 0.5px solid var(--border);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
  }
  .brand-name {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    letter-spacing: -0.3px;
  }
  .brand-badge {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    background: var(--bg2);
    color: var(--ink2);
    padding: 3px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .nav-tabs {
    display: flex; gap: 0;
  }
  .nav-tab {
    padding: 6px 16px;
    font-size: 13px;
    cursor: pointer;
    border: none; background: none;
    color: var(--ink2);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-family: 'DM Sans', sans-serif;
  }
  .nav-tab:hover { color: var(--ink); }
  .nav-tab.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
  .nav-right {
    display: flex; align-items: center; gap: 10px;
  }
  .last-sync {
    font-size: 11px;
    color: var(--ink3);
    font-family: 'DM Mono', monospace;
  }
  .sync-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green); display: inline-block; margin-right: 5px;
  }
  .sync-dot.stale { background: var(--ink3); }

  /* LAYOUT */
  .page { max-width: 1000px; margin: 0 auto; padding: 28px 24px; }
  .view { display: none; }
  .view.active { display: block; }

  /* METRICS ROW */
  .metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .metric {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .metric-val { font-size: 26px; font-weight: 500; letter-spacing: -0.5px; font-family: 'DM Mono', monospace; }
  .metric-lbl { font-size: 11px; color: var(--ink2); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* FILTER STRIP */
  .filter-strip { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .pill {
    font-size: 12px; padding: 5px 13px; border-radius: 20px;
    border: 0.5px solid var(--border2);
    background: var(--bg); cursor: pointer; color: var(--ink2);
    font-family: 'DM Sans', sans-serif;
  }
  .pill:hover { background: var(--bg2); color: var(--ink); }
  .pill.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* COMPANY TABLE */
  .table-wrap {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px;
    font-weight: 500; color: var(--ink3);
    padding: 10px 16px;
    text-align: left;
    border-bottom: 0.5px solid var(--border);
    background: var(--bg2);
  }
  thead th.r { text-align: right; }
  tbody td {
    padding: 12px 16px;
    vertical-align: top;
    border-bottom: 0.5px solid var(--border);
    font-size: 13px;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--bg2); }
  .co-name { font-weight: 500; font-size: 13px; }
  .co-desc { font-size: 12px; color: var(--ink2); margin-top: 3px; line-height: 1.5; }
  .co-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 500; font-family: 'DM Mono', monospace; }
  .t-pre { background: var(--purple-bg); color: var(--purple-text); }
  .t-seed { background: var(--green-bg); color: var(--green-text); }
  .t-a { background: var(--amber-bg); color: var(--amber-text); }
  .t-other { background: var(--bg2); color: var(--ink2); }
  .t-theme { background: var(--bg2); color: var(--ink2); }
  .t-geo { background: var(--blue-bg); color: var(--blue-text); }
  .money { font-family: 'DM Mono', monospace; font-size: 12px; text-align: right; }
  .money .amt { font-weight: 500; }
  .money .rnd { font-size: 11px; color: var(--ink3); margin-top: 2px; }
  .exit-who { font-size: 12px; font-weight: 500; }
  .exit-why { font-size: 11px; color: var(--ink2); margin-top: 2px; line-height: 1.5; }
  .seen-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border2); display: inline-block; margin-right: 5px; vertical-align: middle; flex-shrink: 0; }
  .seen-dot.multi { background: var(--green); }

  /* THEME LIST */
  .theme-list { display: flex; flex-direction: column; gap: 8px; }
  .theme-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex; align-items: center; gap: 14px;
  }
  .t-rank { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--ink3); width: 24px; flex-shrink: 0; }
  .t-info { flex: 1; min-width: 0; }
  .t-name-row { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .t-desc { font-size: 12px; color: var(--ink2); margin-top: 4px; line-height: 1.5; }
  .t-bar-out { width: 100px; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; flex-shrink: 0; }
  .t-bar-in { height: 100%; border-radius: 2px; background: var(--green); }
  .t-signals { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink3); width: 36px; text-align: right; flex-shrink: 0; }
  .sbadge { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-family: 'DM Mono', monospace; }
  .se { background: var(--purple-bg); color: var(--purple-text); }
  .sg { background: var(--green-bg); color: var(--green-text); }
  .sm { background: var(--bg2); color: var(--ink2); }

  /* HISTORY */
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
  }
  .history-title { font-weight: 500; font-size: 13px; }
  .history-meta { font-size: 11px; color: var(--ink3); font-family: 'DM Mono', monospace; margin-top: 3px; }

  /* EMPTY */
  .empty {
    text-align: center; padding: 60px 20px;
    background: var(--bg); border: 0.5px solid var(--border); border-radius: 12px;
  }
  .empty i { font-size: 32px; color: var(--ink3); }
  .empty-t { font-family: 'DM Serif Display', serif; font-size: 20px; margin: 12px 0 8px; }
  .empty-s { font-size: 13px; color: var(--ink2); line-height: 1.7; max-width: 320px; margin: 0 auto; }
  .empty-s code { font-family: 'DM Mono', monospace; font-size: 12px; background: var(--bg2); padding: 2px 6px; border-radius: 4px; }

  /* LOADING */
  .loading { text-align: center; padding: 40px; color: var(--ink3); font-family: 'DM Mono', monospace; font-size: 12px; }

  /* SETUP BANNER */
  .setup-banner {
    background: var(--amber-bg);
    border: 0.5px solid rgba(186,117,23,0.3);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--amber-text);
    display: flex; align-items: flex-start; gap: 10px;
  }
  .setup-banner i { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .setup-banner a { color: var(--amber); text-decoration: underline; }
  .setup-banner code { font-family: 'DM Mono', monospace; font-size: 12px; background: rgba(186,117,23,0.15); padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>

<nav class="topnav">
  <div class="brand">
    <span class="brand-name">Fintech Radar</span>
    <span class="brand-badge">TWIF</span>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" data-view="companies" onclick="switchView(this)">Companies</button>
    <button class="nav-tab" data-view="themes" onclick="switchView(this)">Themes</button>
    <button class="nav-tab" data-view="history" onclick="switchView(this)">History</button>
  </div>
  <div class="nav-right">
    <span class="last-sync" id="sync-status"><span class="sync-dot stale"></span>loading…</span>
  </div>
</nav>

<div class="page">

  <div class="view active" id="view-companies">
    <div id="metrics" class="metrics"></div>
    <div class="filter-strip" id="co-filters"></div>
    <div class="table-wrap"><div id="co-table"></div></div>
  </div>

  <div class="view" id="view-themes">
    <div class="theme-list" id="theme-list"></div>
  </div>

  <div class="view" id="view-history">
    <div class="history-list" id="history-list"></div>
  </div>

</div>

<script>
let data = { companies: [], themes: {}, issues: [], lastUpdated: null };
let activeView = 'companies';
let activeFilter = 'all';

async function loadData() {
  try {
    const resp = await fetch('/api/data');
    if (!resp.ok) throw new Error('API error');
    data = await resp.json();
    updateSyncStatus();
    render();
  } catch(e) {
    document.getElementById('sync-status').innerHTML = '<span class="sync-dot stale"></span>error loading data';
    renderEmpty();
  }
}

function updateSyncStatus() {
  const el = document.getElementById('sync-status');
  if (data.lastUpdated) {
    const d = new Date(data.lastUpdated);
    const ago = Math.round((Date.now() - d) / 86400000);
    const label = ago === 0 ? 'today' : ago === 1 ? 'yesterday' : `${ago}d ago`;
    el.innerHTML = `<span class="sync-dot"></span>last issue: ${label}`;
  } else {
    el.innerHTML = `<span class="sync-dot stale"></span>no issues yet`;
  }
}

function switchView(btn) {
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeView = btn.dataset.view;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + activeView).classList.add('active');
  render();
}

function setFilter(f) { activeFilter = f; renderCompanies(); }

function render() {
  if (activeView === 'companies') renderCompanies();
  else if (activeView === 'themes') renderThemes();
  else renderHistory();
}

function renderEmpty() {
  document.getElementById('co-table').innerHTML = `
    <div class="empty">
      <i class="ti ti-mail-forward"></i>
      <div class="empty-t">Waiting for your first issue</div>
      <div class="empty-s">
        Forward your TWIF emails to<br>
        <code>your-address@resend.dev</code><br><br>
        Each email is automatically processed and companies appear here within seconds.
      </div>
    </div>`;
}

function fmt(n) {
  if (!n || n === 0) return '—';
  if (n >= 1e9) return '$' + (n/1e9).toFixed(1) + 'B';
  if (n >= 1e6) return '$' + (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return '$' + (n/1e3).toFixed(0) + 'K';
  return '$' + n;
}

function stageClass(s) {
  return s==='pre-seed'?'t-pre':s==='seed'?'t-seed':s==='series-a'?'t-a':'t-other';
}

function renderCompanies() {
  const filterDiv = document.getElementById('co-filters');
  const metricsDiv = document.getElementById('metrics');
  const tableDiv = document.getElementById('co-table');

  // Metrics
  const early = data.companies.filter(c => ['pre-seed','seed'].includes(c.stage)).length;
  const withExit = data.companies.filter(c => c.exit?.likelyAcquirer).length;
  metricsDiv.innerHTML = [
    [data.companies.length, 'Companies'],
    [Object.keys(data.themes).length, 'Themes'],
    [early, 'Early stage'],
    [data.issues?.length || 0, 'Issues processed'],
  ].map(([v,l]) => `<div class="metric"><div class="metric-val">${v}</div><div class="metric-lbl">${l}</div></div>`).join('');

  // Filters
  const stages = [...new Set(data.companies.map(c => c.stage).filter(Boolean))];
  filterDiv.innerHTML = `<button class="pill ${activeFilter==='all'?'on':''}" onclick="setFilter('all')">All</button>`
    + stages.map(s => `<button class="pill ${activeFilter===s?'on':''}" onclick="setFilter('${s}')">${s}</button>`).join('');

  let cos = [...data.companies].sort((a,b) => (b.mentions||1)-(a.mentions||1) || (b.funding?.amountUSD||0)-(a.funding?.amountUSD||0));
  if (activeFilter !== 'all') cos = cos.filter(c => c.stage === activeFilter);

  if (!cos.length) { renderEmpty(); return; }

  tableDiv.innerHTML = `<table>
    <thead><tr>
      <th>Company</th>
      <th class="r">Raised</th>
      <th class="r">Valuation</th>
      <th>Likely exit</th>
    </tr></thead>
    <tbody>
    ${cos.map(c => {
      const raised = (c.funding?.amountUSD>0) ? fmt(c.funding.amountUSD) : (c.funding?.amount && c.funding.amount!=='unknown' ? c.funding.amount : '—');
      const val = (c.funding?.valuationUSD>0) ? fmt(c.funding.valuationUSD) : (c.funding?.valuation && c.funding.valuation!=='unknown' ? c.funding.valuation : '—');
      const multi = (c.mentions||1) > 1;
      const themes = (c.themes||[]).slice(0,2).map(t => `<span class="tag t-theme">${t}</span>`).join('');
      const geo = c.geography && c.geography!=='unknown' ? `<span class="tag t-geo">${c.geography}</span>` : '';
      return `<tr>
        <td>
          <div style="display:flex;align-items:center;gap:2px;">
            <span class="seen-dot ${multi?'multi':''}" title="${multi?'seen '+c.mentions+'× across issues':'seen once'}"></span>
            <span class="co-name">${c.name}</span>
            <span class="tag ${stageClass(c.stage)}" style="margin-left:6px;">${c.stage}</span>
          </div>
          <div class="co-desc">${c.description||''}</div>
          <div class="co-tags">${geo}${themes}</div>
        </td>
        <td><div class="money"><div class="amt">${raised}</div><div class="rnd">${c.funding?.round||''}</div></div></td>
        <td><div class="money"><div class="amt">${val}</div></div></td>
        <td>
          <div class="exit-who">${c.exit?.likelyAcquirer || c.exit?.likely || '—'}</div>
          <div class="exit-why">${c.exit?.acquirerRationale||''}</div>
        </td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>`;
}

function renderThemes() {
  const themes = Object.values(data.themes).sort((a,b) => (b.momentum*(b.signalCount||1)) - (a.momentum*(a.signalCount||1)));
  const listDiv = document.getElementById('theme-list');
  if (!themes.length) {
    listDiv.innerHTML = `<div class="empty"><i class="ti ti-chart-line"></i><div class="empty-t">No themes yet</div><div class="empty-s">Themes will appear once emails start arriving.</div></div>`;
    return;
  }
  const maxM = Math.max(...themes.map(t => t.momentum*(t.signalCount||1)));
  listDiv.innerHTML = themes.map((t,i) => {
    const pct = Math.round((t.momentum*(t.signalCount||1))/maxM*100);
    const sc = t.stage==='early'?'se':t.stage==='growing'?'sg':'sm';
    return `<div class="theme-card">
      <div class="t-rank">${String(i+1).padStart(2,'0')}</div>
      <div class="t-info">
        <div class="t-name-row">${t.name}<span class="sbadge ${sc}">${t.stage||''}</span></div>
        <div class="t-desc">${t.description||''}</div>
      </div>
      <div class="t-bar-out"><div class="t-bar-in" style="width:${pct}%"></div></div>
      <div class="t-signals">${t.signalCount||1}×</div>
    </div>`;
  }).join('');
}

function renderHistory() {
  const listDiv = document.getElementById('history-list');
  const issues = data.issues || [];
  if (!issues.length) {
    listDiv.innerHTML = `<div class="empty"><i class="ti ti-inbox"></i><div class="empty-t">No issues yet</div><div class="empty-s">Processed newsletter issues will appear here.</div></div>`;
    return;
  }
  listDiv.innerHTML = issues.map(issue => `
    <div class="history-card">
      <div class="history-title">${issue.title || 'This Week in Fintech'}</div>
      <div class="history-meta">${issue.date} · ${issue.companyCount||0} companies · ${issue.themeCount||0} themes · received ${issue.receivedAt}</div>
    </div>`).join('');
}

loadData();
</script>
</body>
</html>
