<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fintech Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="topnav">
    <div class="brand">
      <span class="brand-name">Fintech Radar</span>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" data-view="companies">Companies</button>
      <button class="nav-tab" data-view="themes">Themes</button>
      <button class="nav-tab" data-view="history">History</button>
    </div>
    <div class="nav-right">
      <button class="refresh-btn" id="refresh-btn">↻ Refresh</button>
      <span class="last-sync" id="sync-status">
        <span class="sync-dot stale"></span>loading…
      </span>
    </div>
  </nav>

  <div class="page">

    <div class="view active" id="view-companies">
      <div id="metrics" class="metrics"></div>
      <div class="filter-strip" id="co-filters"></div>
      <div class="table-wrap"><div id="co-table"></div></div>
    </div>

    <div class="view" id="view-themes">
      <div class="theme-list" id="theme-list"></div>
    </div>

    <div class="view" id="view-history">
      <div class="history-list" id="history-list"></div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
